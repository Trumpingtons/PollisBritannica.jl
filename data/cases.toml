# The cases of Britannica Through the Editions: articles followed through the editions, with what changes from one to
# the next. Each [[cases.editions]] names an edition; `key` and `article` (an ILIKE pattern of the title) pick the
# article, the case's key when `key` is left out; `absent = true` when the edition has no article under it.

[[cases]]
id = "petra"
name = "Petra"
key = "PETRA"
summary = "The city of the Nabataeans in the south of Jordan, known to the first editions only from the classical writers, then from the travellers who reached it from 1812 on, and from the scholars who studied its inscriptions."

[[cases.editions]]
edition = "1"
absent = true
note = "No article on Petra."

[[cases.editions]]
edition = "2"
note = "A short entry listing the towns named Petra in the classical writers, Caesar, Lucian, Livy and Ptolemy among them."

[[cases.editions]]
edition = "3"
note = "The entry of the second edition, reprinted."

[[cases.editions]]
edition = "3S"
absent = true

[[cases.editions]]
edition = "4"
note = "The entry of the second edition, reprinted."

[[cases.editions]]
edition = "5"
note = "The entry of the second edition, reprinted."

[[cases.editions]]
edition = "6"
note = "The entry of the second edition, reprinted."

[[cases.editions]]
edition = "6S"
absent = true

[[cases.editions]]
edition = "7"
absent = true
note = "No article: the article Arabia names Petra in a sentence, its site a subject of dispute."

[[cases.editions]]
edition = "8"
note = "A new article, which credits Burckhardt with finding the ruins."

[[cases.editions]]
edition = "9"
note = "A new article, by W. Robertson Smith."

[[cases.editions]]
edition = "10"
note = "A short new article in the new volumes: a ruined site, easy of access since Turkish troops occupied the plateau of Moab and Edom, and its ruins surveyed."

[[cases.editions]]
edition = "11"
note = "A longer article, signed G. A. C. (George Albert Cooke), which opens as the article of the tenth edition."

[[cases.editions]]
edition = "12"
absent = true

[[cases.editions]]
edition = "13"
absent = true

[[cases.editions]]
edition = "14"
note = "The article of the eleventh edition, shortened and unsigned, with Petra now in Trans-Jordan."

[[cases]]
id = "darwin"
name = "Charles Darwin"
key = "DARWIN"
summary = "Charles Darwin (1809–1882), who has no article while he is alive; the editions of those years have one on his grandfather Erasmus Darwin, physician and poet."

[[cases.editions]]
edition = "1"
absent = true
article = "%CHARLES%"
note = "No article."

[[cases.editions]]
edition = "2"
absent = true
article = "%CHARLES%"

[[cases.editions]]
edition = "3"
absent = true
article = "%CHARLES%"

[[cases.editions]]
edition = "3S"
absent = true
article = "%CHARLES%"

[[cases.editions]]
edition = "4"
absent = true
article = "%CHARLES%"
note = "No article on Charles Darwin. The article DARWIN is on his grandfather Erasmus Darwin, and says nothing of his ideas on the transmutation of species."

[[cases.editions]]
edition = "5"
absent = true
article = "%CHARLES%"
note = "No article on Charles Darwin; the article on Erasmus Darwin of the fourth edition."

[[cases.editions]]
edition = "6"
absent = true
article = "%CHARLES%"
note = "No article on Charles Darwin; the article on Erasmus Darwin of the fourth edition."

[[cases.editions]]
edition = "6S"
absent = true
article = "%CHARLES%"

[[cases.editions]]
edition = "7"
absent = true
article = "%CHARLES%"
note = "No article on Charles Darwin; the article on Erasmus Darwin, shortened."

[[cases.editions]]
edition = "8"
absent = true
article = "%CHARLES%"
note = "No article on Charles Darwin; the article on Erasmus Darwin of the seventh edition."

[[cases.editions]]
edition = "9"
absent = true
article = "%CHARLES%"
note = "No article: volume 6, with the letter D, comes out in 1877, while Charles Darwin is alive. The article on Erasmus Darwin names his evolutionism for the first time."

[[cases.editions]]
edition = "10"
article = "%CHARLES%"
note = "The first article on Charles Darwin, by Edward Bagnall Poulton, in the new volumes of 1902."

[[cases.editions]]
edition = "11"
article = "%CHARLES%"
note = "The article of the tenth edition, signed E. B. P."

[[cases.editions]]
edition = "12"
absent = true
article = "%CHARLES%"

[[cases.editions]]
edition = "13"
absent = true
article = "%CHARLES%"

[[cases.editions]]
edition = "14"
article = "%CHARLES%"
note = "Cut to less than half of the article of the eleventh edition."

[[cases]]
id = "evolution"
name = "Evolution"
key = "EVOLUTION"
summary = "The word evolution, first a term of algebra and of the art of war, then the development of the germ, then the theory of the descent of species, and last organic evolution, a science and a controversy."

[[cases.editions]]
edition = "1"
note = "Evolution in algebra, with a reference to the article Algebra, and in the art of war, the motion of a body of troops changing its form."

[[cases.editions]]
edition = "2"
note = "The same two senses, in algebra and in the art of war."

[[cases.editions]]
edition = "3"
note = "The same two senses; in algebra, now the unfolding of a curve that describes an evolvent."

[[cases.editions]]
edition = "3S"
absent = true

[[cases.editions]]
edition = "4"
note = "The same two senses, in algebra, the unfolding of a curve, and in the art of war."

[[cases.editions]]
edition = "5"
note = "The same two senses, in algebra, the unfolding of a curve, and in the art of war."

[[cases.editions]]
edition = "6"
note = "The same two senses, in algebra, the unfolding of a curve, and in the art of war."

[[cases.editions]]
edition = "6S"
absent = true

[[cases.editions]]
edition = "7"
absent = true
note = "No article."

[[cases.editions]]
edition = "8"
note = "The act of unfolding; in physiology, the theory of generation in which the germ pre-exists in the parent and its parts are merely unfolded, as opposed to epigenesis."

[[cases.editions]]
edition = "9"
note = "A treatise in two parts: evolution in biology, by T. H. Huxley, and in philosophy, by James Sully."

[[cases.editions]]
edition = "10"
absent = true

[[cases.editions]]
edition = "11"
note = "A new article, signed P. C. M. (Peter Chalmers Mitchell), which keeps the part on philosophy by James Sully."

[[cases.editions]]
edition = "12"
absent = true

[[cases.editions]]
edition = "13"
absent = true
note = "No article EVOLUTION: the new volumes have MAN, EVOLUTION OF."

[[cases.editions]]
edition = "14"
article = "EVOLUTION, ORGANIC%"
note = "EVOLUTION, ORGANIC, by Julian Huxley and E. S. Goodrich, each in part, which opens on the controversy that had flared up again 'in certain backward regions'."

